[project]
name = "agent-eval-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "rich>=13",
]

[dependency-groups]
ui = ["streamlit>=1.40", "pandas>=2", "streamlit-autorefresh>=1.0.1"]
# Stretch goal only: uv sync --group tracing
tracing = [
    "arize-phoenix-otel",
    "openinference-instrumentation-openai",
]
